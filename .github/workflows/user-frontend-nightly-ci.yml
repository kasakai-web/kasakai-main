name: user-frontend-nightly-ci

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: user-frontend-nightly
  cancel-in-progress: true

jobs:
  nightly-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
