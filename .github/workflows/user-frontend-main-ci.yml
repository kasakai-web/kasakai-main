name: user-frontend-main-ci

on:
  push:
    branches:
      - main
    paths:
      - user-frontend/**
      - .github/workflows/user-frontend-pr-ci.yml
      - .github/workflows/user-frontend-main-ci.yml
      - .github/workflows/user-frontend-nightly-ci.yml
  workflow_dispatch:

concurrency:
  group: user-frontend-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
